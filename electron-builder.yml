appId: com.da.studio
productName: DA Studio
directories:
  output: build/app/release
files:
  - build/app/dist
  - build/app/dist-electron
  - package.json
  - node_modules/better-sqlite3/package.json
  - node_modules/better-sqlite3/lib/**/*
  - node_modules/better-sqlite3/build/Release/better_sqlite3.node
  - node_modules/bindings/package.json
  - node_modules/bindings/bindings.js
  - node_modules/file-uri-to-path/**/*
asarUnpack:
  - node_modules/better-sqlite3/build/Release/better_sqlite3.node
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
win:
  icon: build/app/icons/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/app/icons/icon.icns
  target:
    - dmg
linux:
  icon: build/app/icons/icon.png
  target:
    - AppImage
